<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Crate</title>
    <!--
      SPA GitHub Pages 404 redirect
      https://github.com/rafgraph/spa-github-pages

      pathSegmentsToKeep:
        0 — custom domain — no repo prefix
        1 — repo subdirectory (brittanyellich.github.io/crate-web) — keep /crate-web
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search
            ? '&' + l.search.slice(1).replace(/&/g, '~and~')
            : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
